<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vegas One</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070514;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p style="margin-top: 16px; font-size: 13px; letter-spacing: 1.5px; color: #94a3b8; text-transform: uppercase; font-weight: 600;">
    Connecting to Vegas One...
  </p>
  <script>
    // Fallback if server.url fails or offline
    setTimeout(function() {
      if (window.location.href.indexOf('vegasone.games') === -1) {
        window.location.href = 'https://vegasone.games';
      }
    }, 1500);
  </script>
</body>
</html>
